services:
  - type: web
    name: Backend
    rootDir: Backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production

  - type: web
    name: Frontend
    env: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
